name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (pre-installed on ubuntu-latest)
        run: |
          set -e
          # GitHub runner'ında sdkmanager PATH'te değil — cmdline-tools/bin'i ekle
          SDK_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
          [ -d "$SDK_BIN" ] || SDK_BIN="$ANDROID_HOME/cmdline-tools/bin"
          export PATH="$SDK_BIN:$PATH"
          # Sonraki step'ler için PATH'e kalıcı ekle
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          
          echo "sdkmanager yolu: $(command -v sdkmanager)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          
          # Lisansları kabul et (yes'in broken pipe mesajı zararsız, || true ile geç)
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Gerekli paketleri kur (zaten kuruluysa hızlıca atlar)
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          
          echo "--- Kurulu paketler ---"
          sdkmanager --list_installed 2>/dev/null || sdkmanager --list | head -60

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build release APK (debug signing)
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: photto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: photto-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
